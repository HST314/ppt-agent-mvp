openapi: 3.1.0
info: {title: PPT Agent P1 API, version: 0.2.0}
components:
  parameters:
    TaskId: {in: path, name: task_id, required: true, schema: {type: string}}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: object, required: [code, message, diagnostic_id], properties: {code: {type: string}, message: {type: string}, diagnostic_id: {type: string}}}
    TaskState:
      type: object
      required: [task_id, stage, status, mode, revision]
      properties: {task_id: {type: string}, stage: {type: string}, status: {type: string}, mode: {enum: [manual, auto]}, revision: {type: integer}, waiting_reason: {type: [string, 'null']}, required_action: {type: [string, 'null']}}
    Command:
      type: object
      additionalProperties: false
      required: [command_id, action]
      properties: {command_id: {type: string}, action: {type: string}, actor: {enum: [system, user]}, payload: {type: object}}
  responses:
    Error: {description: Domain error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}, example: {error: {code: validation_error, message: 请求字段无效, diagnostic_id: abc123}}}}}
paths:
  /healthz:
    get: {responses: {'200': {description: Ready}}}
  /v1/tasks:
    post:
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [task_id], properties: {task_id: {type: string}, mode: {enum: [manual, auto]}}}, example: {task_id: demo, mode: manual}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/TaskState'}}}}, '400': {$ref: '#/components/responses/Error'}}
  /v1/tasks/{task_id}:
    get: {parameters: [{$ref: '#/components/parameters/TaskId'}], responses: {'200': {description: Current state}, '404': {$ref: '#/components/responses/Error'}}}
  /v1/tasks/{task_id}/actions:
    post: {parameters: [{$ref: '#/components/parameters/TaskId'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}, example: {command_id: cmd-1, action: advance, actor: system}}}}, responses: {'200': {description: Stable command result}, '409': {$ref: '#/components/responses/Error'}}}
  /v1/tasks/{task_id}/events:
    get: {parameters: [{$ref: '#/components/parameters/TaskId'}], responses: {'200': {description: Audit event list}}}
  /v1/tasks/{task_id}/versions:
    get: {parameters: [{$ref: '#/components/parameters/TaskId'}], responses: {'200': {description: Version list}}}
  /v1/tasks/{task_id}/versions/{hash}:
    get: {parameters: [{$ref: '#/components/parameters/TaskId'}, {in: path, name: hash, required: true, schema: {type: string, pattern: '^[0-9a-f]{64}$'}}], responses: {'200': {description: Immutable version}, '404': {$ref: '#/components/responses/Error'}}}
  /v1/tasks/{task_id}/versions/compare:
    post: {parameters: [{$ref: '#/components/parameters/TaskId'}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [left, right], properties: {left: {type: string}, right: {type: string}}}}}}, responses: {'200': {description: Comparison result}}}
  /v1/tasks/{task_id}/preview:
    post: {parameters: [{$ref: '#/components/parameters/TaskId'}], requestBody: {content: {application/json: {schema: {type: object}}}}, responses: {'200': {description: Generated preview and inspection}}}
  /v1/tasks/{task_id}/issues/{issue_id}/disposition:
    post: {parameters: [{$ref: '#/components/parameters/TaskId'}, {in: path, name: issue_id, required: true, schema: {type: string}}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [command_id, action, actor], properties: {command_id: {type: string}, action: {type: string}, actor: {const: user}}}}}}, responses: {'200': {description: Disposed}, '409': {$ref: '#/components/responses/Error'}}}
