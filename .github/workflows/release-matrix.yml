name: v2 release matrix

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_real_model:
        description: Run the secret-backed real model journey
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  full-automation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - name: Install Skill script sandbox dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --die-with-parent --ro-bind / / -- /usr/bin/true
      - run: python3 scripts/verify_release_matrix.py --profile full
      - name: Contract-first rebuild tests
        run: python -m pytest -q tests/rebuild tests/e2e/test_rebuild_offline_delivery.py tests/browser/test_rebuild_golden_path.py

  real-model:
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_model
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      MODEL_BASE_URL: ${{ secrets.MODEL_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python3 scripts/verify_release_matrix.py --profile real-model
      - name: Contract-first real-model release gate
        run: python3 scripts/verify_rebuild_release.py --runs 20
